<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order summary</title>
    <link rel="stylesheet" href="./Order-summary.css">
</head>
<body>
    
    <main class="card">
    <div class="illustration">
    <img  src="./illustration-hero.svg" alt="illustration pic">
    </div>
    <section class="content">
    <h1>Order Summary</h1>
    <p class="para"> You can now listen to millions of songs, audiobooks, and podcast on any  device anywhere you like.</p>
    <div class="plan">
        <div class="music icon">
            <img src="./icon-music.svg" alt="music icon">
        </div>
        <div class="plan-info">
            <h2>Annual plan</h2>
            <p class="amount">$59.99/year</p>
            
        </div>
        <a href="linkedIn.com" class="link">change</a>
        </div>
        <button class="payment">Proceed to Payment</button>
        <a href="soundcloud.com" class="cancel">Cancel Order</a>
    </section>
    </main>
</body>
</html>
